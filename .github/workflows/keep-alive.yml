name: Keep Supabase Alive

# Free-tier Supabase projects pause after 7 days with no activity. This makes
# an authenticated REST request every six hours, leaving generous headroom
# while detecting a broken keep-alive path quickly.
#
# The anon key below is already public (it ships in the frontend JS bundle), so
# there is no secret to protect here. If you rotate the project, update the URL
# and key, or move them to repo secrets and reference them as ${{ secrets.* }}.

on:
  schedule:
    # Spread requests through the day. GitHub schedules can be delayed, so do
    # not rely on one particular daily run for a live programme.
    - cron: '17 */6 * * *'
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST
        run: |
          URL="https://vnmeeqvwqaeczjlvzoul.supabase.co/rest/v1/Cohort?select=id&limit=1"
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZubWVlcXZ3cWFlY3pqbHZ6b3VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk1MjA2NzksImV4cCI6MjA3NTA5NjY3OX0.kOQ83MGj94u-86j8LT6YahJLRrYrqloDGSKeN_CEc70"
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            "$URL")
          echo "Supabase REST responded: $code"
          # A successful authenticated request proves both that Supabase is
          # awake and that this request is actually eligible to keep it awake.
          # Treat auth/configuration failures as failures; a 401/403 should not
          # silently disguise a dead keep-alive setup.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Supabase keep-alive failed (HTTP $code)"
            exit 1
          fi
