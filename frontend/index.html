<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FOF Ops</title>

    <!-- Start the connection to the database while the app code downloads, and show a light
         first screen instead of a blank page. The app replaces #boot when it starts. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preload" as="image" href="/logo-full.png" />
    <style>
      html, body { margin: 0; }
      body { min-height: 100vh; background: radial-gradient(circle at top left, #fff1e6, transparent 32%), linear-gradient(180deg, #fff8f3 0%, #f7f8fb 38%, #f4f6fb 100%); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
      #boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
      #boot img { display: block; height: 44px; width: auto; }
      #boot i { display: block; position: relative; width: 120px; height: 4px; border-radius: 99px; background: #ffe2cc; overflow: hidden; }
      #boot i::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 99px; background: #ff914d; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot i::after { animation: none; width: 100%; } }
    </style>

    <!-- Link previews (WhatsApp, iMessage, X, LinkedIn, Facebook) and search.
         Must stay static here — preview crawlers don't run JavaScript. -->
    <meta name="description" content="Foundation of Faith is The Covenant Nation Ikorodu's 10-week foundational course — anchoring new believers and new members in biblical truth and helping them find their home in the church." />
    <meta name="theme-color" content="#0F0D0B" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Foundation of Faith — TCN Ikorodu" />
    <meta property="og:title" content="Foundation of Faith — TCN Ikorodu" />
    <meta property="og:description" content="A 10-week foundational course anchoring new believers and new members in biblical truth, and helping them find their home in the church." />
    <meta property="og:url" content="https://fof.tcnikorodu.org/" />
    <meta property="og:image" content="https://fof.tcnikorodu.org/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Foundation of Faith — a 10-week foundational course at The Covenant Nation Ikorodu" />
    <meta property="og:locale" content="en_NG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Foundation of Faith — TCN Ikorodu" />
    <meta name="twitter:description" content="A 10-week foundational course anchoring new believers and new members in biblical truth, and helping them find their home in the church." />
    <meta name="twitter:image" content="https://fof.tcnikorodu.org/og-image.png" />
    <meta name="twitter:image:alt" content="Foundation of Faith — a 10-week foundational course at The Covenant Nation Ikorodu" />
  </head>
  <body>
    <div id="root"><div id="boot"><img src="/logo-full.png" width="154" height="44" alt="FOF Ops" /><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
