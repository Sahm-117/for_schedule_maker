<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOF Ops Guide</title>
<style>
  svg.gi { width: 1.1em; height: 1.1em; display: block; flex: none; }
  .eyebrow svg.gi, .hello svg.gi { display: inline-block; vertical-align: -0.15em; }
  /* Poppins (SIL Open Font License, see fonts/Poppins-OFL.txt), bundled so the guide works offline. */
  @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/Poppins-400.woff2') format('woff2'); }
  @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/Poppins-500.woff2') format('woff2'); }
  @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/Poppins-600.woff2') format('woff2'); }
  @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/Poppins-700.woff2') format('woff2'); }
  :root {
    --primary: #FF914D;
    --primary-deep: #C2410C;
    --primary-soft: rgba(255,145,77,.13);
    --ink: #1F1A17;
    --ink-2: #6B625C;
    --ink-3: #8A817A;
    --cream: #FFFAF5;
    --card: #FFFFFF;
    --soft: #FBF6F1;
    --line: rgba(43,18,4,.07);
    --shadow: 0 1px 2px rgba(43,18,4,.04), 0 8px 24px rgba(43,18,4,.06);
    --shadow-lift: 0 2px 4px rgba(43,18,4,.05), 0 18px 40px rgba(43,18,4,.11);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 96px; }
  .hidden { display: none !important; }

  /* ---------- Top bar: brand, the always-on "How can I…?" box, role switch ---------- */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,250,245,.84);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    backdrop-filter: saturate(180%) blur(18px);
    border-bottom: 1px solid var(--line);
  }
  .top-inner { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; }
  .brand { font-weight: 700; font-size: 15px; white-space: nowrap; display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 0; }
  .brand-dot { width: 32px; height: 32px; border-radius: 11px; background: linear-gradient(145deg, #FFA66B, #FF7F3A); display: grid; place-items: center; color: #fff; font-size: 16px; font-weight: 800; box-shadow: 0 4px 12px rgba(255,127,58,.35); }
  .search { flex: 1; position: relative; min-width: 0; }
  .search input {
    width: 100%; height: 42px; border-radius: 12px; border: 0;
    background: rgba(118,118,128,.12); box-shadow: none;
    padding: 0 40px 0 36px; font-size: 16px; letter-spacing: 0; color: var(--ink); outline: none;
    -webkit-appearance: none; appearance: none; transition: background .2s ease;
  }
  .search input::placeholder { color: #8E8E93; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input:focus { background: rgba(118,118,128,.16); }
  .search .mag { position: absolute; left: 11px; top: 12px; width: 18px; height: 18px; color: #8E8E93; pointer-events: none; }
  .search .clear {
    position: absolute; right: 4px; top: 3px; width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: none; display: none; place-items: center; padding: 0;
  }
  .search .clear span { width: 18px; height: 18px; border-radius: 50%; background: #AEAEB2; color: #fff; display: grid; place-items: center; }
  .search.has .clear { display: grid; }
  .cancel {
    border: 0; background: none; color: var(--primary-deep); font-size: 16px; padding: 0 2px; height: 42px;
    white-space: nowrap; display: none;
  }
  .top.searching .cancel { display: block; animation: fadeIn .18s ease; }
  @media (max-width: 600px) { .top.searching .brand, .top.searching .role-chip { display: none; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(6px); } to { opacity: 1; transform: none; } }
  .role-chip {
    height: 44px; border: 0; border-radius: 14px; background: var(--card); box-shadow: var(--shadow);
    padding: 0 14px; font-weight: 600; font-size: 14px; white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  @media (max-width: 600px) { .brand-text { display: none; } .role-chip .long { display: none; } .role-chip { padding: 0 12px; } }

  /* ---------- Role picker ---------- */
  .picker { padding: 44px 0 20px; text-align: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--primary-deep); background: var(--primary-soft); border-radius: 999px; padding: 4px 12px; margin-bottom: 14px; }
  .picker h1 { font-size: clamp(30px, 7vw, 46px); line-height: 1.08; margin: 0 0 12px; letter-spacing: -.025em; }
  .picker > p { color: var(--ink-2); margin: 0 auto 30px; max-width: 520px; font-size: 17px; }
  .roles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); text-align: left; max-width: 980px; margin: 0 auto; }
  .role-card {
    border: 0; background: var(--card); border-radius: 26px; padding: 22px; box-shadow: var(--shadow);
    text-align: left; transition: transform .18s ease, box-shadow .18s ease; display: flex; flex-direction: column; gap: 4px;
  }
  .role-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
  .role-card:active { transform: scale(.99); }
  .role-card .tile { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-size: 28px; margin-bottom: 12px; }
  .role-card h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .role-card p { margin: 2px 0 14px; color: var(--ink-2); font-size: 15px; }
  .role-card .go { margin-top: auto; font-size: 14px; font-weight: 600; color: var(--primary-deep); display: flex; align-items: center; gap: 4px; }
  .role-card .count { font-weight: 500; color: var(--ink-3); }

  /* ---------- Role home ---------- */
  .hero {
    margin-top: 22px; border-radius: 28px; padding: 26px 24px; color: #fff; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #FF9A57 0%, #FF7F3A 55%, #F2672A 100%);
    box-shadow: 0 16px 40px rgba(242,103,42,.25);
  }
  .hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .hero::before { content: ""; position: absolute; right: 60px; bottom: -90px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .hero .hello { font-size: 14px; font-weight: 600; opacity: .9; }
  .hero h1 { margin: 4px 0 6px; font-size: clamp(26px, 5.5vw, 36px); line-height: 1.12; letter-spacing: -.02em; position: relative; z-index: 1; }
  .hero p { margin: 0; max-width: 560px; opacity: .95; position: relative; z-index: 1; }
  .hero .ask { margin-top: 18px; position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; width: 100%; max-width: 520px; height: 50px; border: 0; border-radius: 16px; background: #fff; color: var(--ink-3); padding: 0 16px; text-align: left; box-shadow: 0 8px 24px rgba(120,40,0,.18); }
  .hero .ask svg { width: 18px; height: 18px; flex: none; }
  .hero .ask .ask-t { min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .block-title { display: flex; align-items: baseline; justify-content: space-between; margin: 34px 0 12px; }
  .block-title h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .block-title span { font-size: 14px; color: var(--ink-3); }

  .popular { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .pop {
    border: 0; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px;
    display: flex; gap: 12px; align-items: center; text-align: left; transition: transform .15s ease, box-shadow .15s ease;
  }
  .pop:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .pop .pe { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; }
  .pop .pq, .pop .ps { display: block; }
  .pop .pq { font-weight: 600; font-size: 15px; line-height: 1.35; }
  .pop .ps { font-size: 13px; color: var(--ink-3); margin-top: 1px; }

  .topics { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .topic {
    border: 0; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
    text-align: left; display: flex; flex-direction: column; gap: 2px; transition: transform .15s ease, box-shadow .15s ease; text-decoration: none;
  }
  .topic:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .topic .te { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 23px; margin-bottom: 10px; }
  .topic h3 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
  .topic p { margin: 3px 0 10px; font-size: 14px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .topic .n { margin-top: auto; font-size: 13px; font-weight: 600; color: var(--primary-deep); }

  .helpcard { margin-top: 34px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; display: flex; gap: 14px; align-items: center; }
  .helpcard .he { flex: none; width: 46px; height: 46px; border-radius: 15px; background: rgba(16,185,129,.12); display: grid; place-items: center; font-size: 22px; }
  .helpcard .ht { display: block; font-weight: 700; }
  .helpcard span { font-size: 14px; color: var(--ink-2); }

  /* ---------- Topic (section) page ---------- */
  .layout { display: grid; gap: 28px; grid-template-columns: 250px minmax(0, 1fr); padding-top: 22px; }
  .layout > * { min-width: 0; }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { display: none; } }
  .side { position: sticky; top: 80px; align-self: start; max-height: calc(100vh - 96px); overflow: auto; padding: 2px 4px 12px 2px; }
  .side .home-link { display: flex; align-items: center; gap: 8px; padding: 9px 12px; margin-bottom: 6px; border-radius: 12px; font-size: 14px; font-weight: 600; text-decoration: none; color: var(--primary-deep); }
  .side .home-link:hover { background: var(--primary-soft); }
  .side a.s {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; color: var(--ink-2); text-decoration: none; font-size: 14px;
  }
  .side a.s .mini { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; font-size: 14px; flex: none; }
  .side a.s:hover { background: rgba(255,255,255,.7); color: var(--ink); }
  .side a.s.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }

  .back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: #fff; box-shadow: var(--shadow); border-radius: 999px; padding: 7px 14px 7px 10px; font-size: 14px; font-weight: 600; color: var(--ink-2); text-decoration: none; }
  .back svg { width: 16px; height: 16px; }
  .sec-head { display: flex; gap: 16px; align-items: center; margin: 18px 0 6px; }
  .sec-head .te { flex: none; width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; font-size: 29px; }
  .sec-head h1 { margin: 0; font-size: clamp(24px, 5vw, 32px); line-height: 1.15; letter-spacing: -.02em; }
  .where { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; color: var(--primary-deep); background: var(--primary-soft); border-radius: 999px; padding: 4px 12px; line-height: 1.4; }
  .where svg { width: 13px; height: 13px; flex: none; }
  .summary { color: var(--ink-2); margin: 12px 0 18px; font-size: 16.5px; max-width: 680px; }

  /* Screenshots: wide ones sit in a soft card; tall (phone) ones get a phone frame. */
  figure { margin: 16px 0 0; }
  figure img { border-radius: 16px; box-shadow: var(--shadow); cursor: zoom-in; background: var(--soft); max-height: 540px; width: auto; max-width: 100%; }
  figure.tall img { width: 270px; max-width: 78vw; max-height: none; border-radius: 30px; border: 7px solid #fff; box-shadow: 0 0 0 1px rgba(43,18,4,.06), var(--shadow-lift); }
  figure figcaption { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
  .sec-shot { margin: 0 0 22px; }

  .qlabel { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 26px 0 10px; }
  .task { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 10px; scroll-margin-top: 84px; overflow: hidden; transition: box-shadow .25s; }
  .task summary {
    list-style: none; padding: 16px 18px; font-weight: 600; display: flex; gap: 12px; align-items: center; cursor: pointer; line-height: 1.35;
  }
  .task summary::-webkit-details-marker { display: none; }
  .task summary:hover { background: rgba(255,145,77,.04); }
  .task summary .chev { margin-left: auto; flex: none; width: 28px; height: 28px; padding: 5px; border-radius: 50%; background: var(--soft); color: var(--ink-3); transition: transform .2s, background .2s; }
  .task[open] summary .chev { transform: rotate(90deg); background: var(--primary-soft); color: var(--primary-deep); }
  .task .q-icon { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-deep); display: grid; place-items: center; font-size: 14px; font-weight: 800; }
  .task-body { padding: 2px 20px 20px 60px; }
  @media (max-width: 600px) { .task-body { padding: 2px 16px 18px; } }
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  .steps li { counter-increment: step; position: relative; padding: 3px 0 3px 40px; margin: 8px 0; }
  .steps li::before {
    content: counter(step); position: absolute; left: 0; top: 2px; width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(145deg, #FFA66B, #FF7F3A); color: #fff; font-size: 13px; font-weight: 800; display: grid; place-items: center;
  }
  .steps li:not(:last-child)::after { content: ""; position: absolute; left: 13.5px; top: 32px; bottom: -12px; width: 1px; background: rgba(255,127,58,.25); }
  .note { margin-top: 12px; border-radius: 14px; padding: 12px 14px 12px 44px; font-size: 15px; position: relative; }
  .note::before { position: absolute; left: 14px; top: 11px; font-size: 17px; }
  .note b.lead { display: block; font-size: 13px; letter-spacing: .02em; margin-bottom: 1px; }
  .note.result { background: rgba(16,185,129,.09); }
  .note.result::before { content: ""; width: 20px; height: 20px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23047857' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z'/></svg>") center/contain no-repeat; }
  .note.result b.lead { color: #047857; }
  .note.tips { background: rgba(245,158,11,.10); }
  .note.tips::before { content: ""; width: 20px; height: 20px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B45309' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z'/></svg>") center/contain no-repeat; }
  .note.tips b.lead { color: #B45309; }
  .note ul { margin: 2px 0 0; padding-left: 18px; }
  .note li { margin: 3px 0; }
  .task.flash { box-shadow: 0 0 0 3px rgba(255,145,77,.55), var(--shadow); }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 30px; }
  .pager a { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 16px; text-decoration: none; display: block; min-width: 0; }
  .pager a:hover { box-shadow: var(--shadow-lift); }
  .pager small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .pager span { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pager .next { text-align: right; grid-column: 2; }

  /* ---------- Search results (Apple-style inset grouped lists) ---------- */
  .results { margin: 14px auto 0; max-width: 720px; }
  .results .meta { font-size: 13px; color: #6E6E73; margin: 4px 4px 14px; }
  .results .meta b { color: var(--ink); font-weight: 600; }
  .results .meta button { border: 0; background: none; padding: 0; color: var(--primary-deep); font-size: 13px; }
  .grp { margin-bottom: 22px; }
  .grp-h { font-size: 13px; font-weight: 400; color: #6E6E73; text-transform: uppercase; letter-spacing: .02em; margin: 0 16px 7px; display: flex; justify-content: space-between; align-items: baseline; }
  .grp-h button { border: 0; background: none; padding: 0; color: var(--primary-deep); font-size: 15px; text-transform: none; letter-spacing: 0; }
  .list { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(43,18,4,.04); }
  .row {
    width: 100%; border: 0; background: none; text-align: left; display: flex; align-items: center; gap: 12px;
    padding: 11px 14px 11px 16px; min-height: 52px; position: relative;
  }
  .row + .row::before { content: ''; position: absolute; top: 0; right: 0; left: 64px; border-top: .5px solid rgba(60,60,67,.18); }
  .row.plain + .row.plain::before { left: 16px; }
  .row:active, .row.active { background: rgba(118,118,128,.12); }
  @media (hover: hover) { .row:hover { background: rgba(118,118,128,.07); } }
  .row .ico { flex: none; width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-size: 18px; }
  .row .ico.g { background: none; color: #8E8E93; width: 20px; }
  .row .txt { flex: 1; min-width: 0; }
  .row .t1 { font-size: 16px; line-height: 1.35; letter-spacing: 0; color: #3A3A3C; font-weight: 400; }
  .row .t2 { font-size: 14px; line-height: 1.45; color: #6E6E73; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .t3 { font-size: 13px; color: #8E8E93; margin-top: 3px; }
  .row .chev { flex: none; color: #C4C4C7; }
  .row mark { background: none; color: var(--ink); font-weight: 600; }
  .top-hit .row { padding: 16px; align-items: flex-start; }
  .top-hit .row .ico { width: 44px; height: 44px; border-radius: 11px; font-size: 22px; }
  .top-hit .row .t1 { font-size: 18px; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .top-hit .row .t1 mark { font-weight: 700; }
  .top-hit .row .t2 { -webkit-line-clamp: 3; margin-top: 5px; }
  .top-hit .row .chev { margin-top: 12px; }
  .empty { text-align: center; padding: 48px 20px 26px; color: #6E6E73; }
  .empty svg { color: #AEAEB2; }
  .empty h3 { font-size: 22px; font-weight: 700; color: var(--ink); margin: 12px 0 6px; letter-spacing: -.02em; }
  .empty p { margin: 0 auto; max-width: 340px; font-size: 15px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .lightbox { position: fixed; inset: 0; background: rgba(20,12,8,.88); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; cursor: zoom-out; }
  .lightbox.on { display: flex; }
  .lightbox img { max-height: 100%; max-width: 100%; border-radius: 14px; }
  .foot { margin-top: 48px; font-size: 13px; color: var(--ink-3); text-align: center; }

  /* Colour tiles for topic icons */
  .c0 { background: #FFEDD5; } .c1 { background: #E0F2FE; } .c2 { background: #DCFCE7; } .c3 { background: #EDE9FE; }
  .c4 { background: #FCE7F3; } .c5 { background: #FEF3C7; } .c6 { background: #CFFAFE; } .c7 { background: #E0E7FF; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <button class="brand" id="brand" type="button" aria-label="Guide home"><span class="brand-dot">?</span><span class="brand-text">FOF Ops guide</span></button>
    <label class="search" id="searchBox" aria-label="How can I…?">
      <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="How can I…?" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <button class="clear" id="clear" type="button" aria-label="Clear search"><span><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span></button>
    </label>
    <button class="cancel" id="cancel" type="button">Cancel</button>

      'login signin logon access', 'logout signout', 'password passcode',
      'number phone mobile', 'email mail gmail', 'delete remove erase', 'edit change update fix correct modify rename',
      'add create new save make', 'message text msg chat dm', 'photo picture pic avatar image selfie',
      'notification alert reminder push bell', 'signup register registration registered', 'attendance present absent',
      'participant member student attendee', 'support leader rep volunteer', 'cohort batch intake',
      'schedule timetable calendar programme plan week', 'meeting call zoom meet gmeet', 'link url',
      'colour color theme accent', 'download export pdf print', 'find search look locate', 'problem issue error trouble stuck broken',
      'followup contact prospect lead', 'concern worry flag', 'announcement notice broadcast', 'template ready', 'hub team',
      'recap summary', 'question ask', 'group cell', 'assign allocate give hand', 'status stage stand', 'invite invited bring',
      'person someone somebody people', 'havent hasnt hadnt didnt', 'turn enable switch activate set'
    ];
    function norm(s) {
      s = String(s || '').toLowerCase();
      if (s.normalize) s = s.normalize('NFKD').replace(/[̀-ͯ]/g, '');
      s = s.replace(/[’'`]/g, '').replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ');
      PHRASES.forEach(function (p) { s = s.replace(p[0], p[1]); });
      return s.trim();
    }
    function stem(w) {
      if (w.length > 4 && /ies$/.test(w)) return w.slice(0, -3) + 'y';
      if (w.length > 5 && /ing$/.test(w)) return w.slice(0, -3);
      if (w.length > 4 && /ed$/.test(w)) return w.slice(0, -2);
      if (w.length > 4 && /(ss|x|ch|sh)es$/.test(w)) return w.slice(0, -2);
      if (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
      return w;
    }
    function tokens(s, keepStop) {
      return norm(s).split(' ').filter(function (w) { return w && (keepStop || !STOP[w]); }).map(stem);
    }
    var SYN = {};
    GROUPS.forEach(function (g) {
      var ws = g.split(' ').map(stem);
      ws.forEach(function (w) { SYN[w] = (SYN[w] || []).concat(ws.filter(function (x) { return x !== w; })); });
    });
    // Damerau–Levenshtein distance, stopping early once it's over the limit.
    function dist(a, b, max) {
      if (Math.abs(a.length - b.length) > max) return max + 1;
      var d = [], i, j;
      for (i = 0; i <= a.length; i++) { d[i] = [i]; }
      for (j = 0; j <= b.length; j++) { d[0][j] = j; }
      for (i = 1; i <= a.length; i++) {
        var rowMin = Infinity;
        for (j = 1; j <= b.length; j++) {
          var c = a[i - 1] === b[j - 1] ? 0 : 1;
          d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
          if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
          if (d[i][j] < rowMin) rowMin = d[i][j];
        }
        if (rowMin > max) return max + 1;
      }
      return d[a.length][b.length];
    }
    var FIELDS = { q: 10, kw: 7, topic: 3.5, body: 1.4 };

    function build(G) {
      var docs = [], vocab = {}, df = {};
      Object.keys(G.roles).forEach(function (r) {
        (G.roles[r].sections || []).forEach(function (s, si) {
          (s.tasks || []).forEach(function (t) {
            var lines = (t.steps || []).concat([t.result || ''], t.tips || []).filter(Boolean);
            var f = {
              q: tokens(t.q), kw: tokens((t.keywords || []).join(' ')),
              topic: tokens(s.title + ' ' + (s.where || '') + ' ' + (s.summary || '')), body: tokens(lines.join(' '))
            };
            var sets = {}, seen = {};
            Object.keys(f).forEach(function (k) {
              sets[k] = {};
              f[k].forEach(function (w) { sets[k][w] = (sets[k][w] || 0) + 1; vocab[w] = 1; if (!seen[w]) { seen[w] = 1; df[w] = (df[w] || 0) + 1; } });
            });
            docs.push({ r: r, s: s, i: si, t: t, sets: sets, qNorm: ' ' + tokens(t.q, true).join(' ') + ' ', kwNorm: (t.keywords || []).map(function (k) { return ' ' + tokens(k, true).join(' ') + ' '; }), qLen: f.q.length || 1, lines: lines, popular: !!t.popular });
          });
        });
      });
      var words = Object.keys(vocab), N = docs.length;
      function idf(w) { return Math.log(1 + N / (df[w] || 1)); }
      var maxIdf = Math.log(1 + N);

      // Every way a typed word could be meant: itself, its synonyms, close spellings,
      // and (for the word still being typed) longer words that start with it.
      function variants(w, isLast) {
        var out = {}; out[w] = 1;
        (SYN[w] || []).forEach(function (x) { if (!out[x]) out[x] = 0.8; });
        if (!vocab[w] || isLast) {
          var max = w.length >= 7 ? 2 : w.length >= 4 ? 1 : 0;
          words.forEach(function (v) {
            if (out[v]) return;
            if (isLast && w.length >= 2 && v.length > w.length && v.indexOf(w) === 0) { out[v] = Math.max(out[v] || 0, 0.72); return; }
            if (max && dist(w, v, max) <= max) out[v] = Math.max(out[v] || 0, v[0] === w[0] ? 0.7 : 0.55);
          });
          // A typo of a synonym still counts ("avatr" → avatar → photo).
          Object.keys(out).forEach(function (v) { if (out[v] < 1) (SYN[v] || []).forEach(function (x) { if (!out[x]) out[x] = out[v] * 0.8; }); });
        }
        return out;
      }

      function search(qs, role) {
        var raw = tokens(qs);
        if (!raw.length) return { hits: [], corrected: null };
        var terms = raw.map(function (w, i) { return { w: w, v: variants(w, i === raw.length - 1 && !/\s$/.test(qs)) }; });
        var qPhrase = ' ' + tokens(qs, true).join(' ') + ' ';
        var hits = [];
        docs.forEach(function (d) {
          var score = 0, matched = 0, used = [], inQ = 0;
          terms.forEach(function (term) {
            var best = 0, bestWord = null;
            Object.keys(term.v).forEach(function (v) {
              var got = 0;
              Object.keys(FIELDS).forEach(function (k) { if (d.sets[k][v]) got += FIELDS[k] * (k === 'body' ? Math.min(1.6, 1 + (d.sets[k][v] - 1) * 0.3) : 1); });
              got *= term.v[v] * (0.55 + 0.45 * idf(v) / maxIdf);
              if (got > best) { best = got; bestWord = v; }
            });
            if (best > 0) { matched++; score += best; used.push(bestWord); if (d.sets.q[bestWord]) inQ++; }
          });
          if (!matched) return;
          score *= Math.pow(matched / terms.length, 1.6);
          if (raw.length > 1 && qPhrase.trim()) {
            if (d.qNorm.indexOf(qPhrase) > -1) score += 12;
            else if (d.kwNorm.some(function (k) { return k.indexOf(qPhrase) > -1; })) score += 8;
          }
          // Of two questions that match equally, the shorter, more focused one wins.
          score += 6 * inQ / d.qLen;
          if (d.popular) score *= 1.06;
          if (role && d.r !== role) score *= 0.2;
          hits.push({ r: d.r, s: d.s, i: d.i, t: d.t, score: score, used: used, lines: d.lines });
        });
        hits.sort(function (a, b) { return b.score - a.score; });
        // Keep it focused: drop weak matches far below the best one.
        if (hits.length) { var floor = hits[0].score * 0.25; hits = hits.filter(function (h) { return h.score >= floor; }); }
        // "Showing results for …" when a typed word was a clear misspelling.
        var corrected = null;
        if (hits.length) {
          var fixes = terms.map(function (term) {
            if (vocab[term.w] || SYN[term.w]) return term.w;
            var best = null, bw = 0;
            hits[0].used.forEach(function (u) { if (term.v[u] && term.v[u] > bw && term.v[u] < 1 && term.v[u] >= 0.55 && !(u.indexOf(term.w) === 0)) { bw = term.v[u]; best = u; } });
            return best || term.w;
          });
          if (fixes.join(' ') !== raw.join(' ')) corrected = fixes.join(' ');
        }
        return { hits: hits.slice(0, 12), corrected: corrected };
      }

      // The step or tip that best matches, shown under the question.
      function snippet(hit) {
        var want = {}; hit.used.forEach(function (u) { want[u] = 1; });
        var best = null, bs = 0;
        hit.lines.forEach(function (line) {
          var n = 0; tokens(line).forEach(function (w) { if (want[w]) n++; });
          if (n > bs) { bs = n; best = line; }
        });
        return best;
      }
      return { search: search, snippet: snippet, tokens: tokens, stem: stem, norm: norm };
    }
    return { build: build };
  })();

  var engine = SearchEngine.build(G);
  var CHEV = '<svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
  var MAG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  var CLOCK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

  // Recent searches stay on this device only.
  var RECENT_KEY = 'fofGuideRecent';
  function recent() { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { return []; } }
  function remember(q) {
    q = String(q || '').trim(); if (q.length < 2) return;
    var list = recent().filter(function (x) { return x.toLowerCase() !== q.toLowerCase(); });
    list.unshift(q);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5))); } catch (e) { /* private mode */ }
  }

  // Words that matched are shown in bold, the way Spotlight does.
  function plain(text) { return String(text || '').replace(/\*\*(.+?)\*\*/g, '$1'); }
  function marked(text, used) {
    var want = {}; (used || []).forEach(function (u) { want[u] = 1; });
    return String(plain(text)).split(/([A-Za-z0-9’']+)/).map(function (part, i) {
      if (i % 2 === 0) return esc(part);
      var tk = engine.tokens(part)[0];
      return tk && want[tk] ? '<mark>' + esc(part) + '</mark>' : esc(part);
    }).join('');
  }

  var current = [], active = -1;
  function rowHtml(h, idx, big) {
    var snip = engine.snippet(h);
    return '<button class="row" type="button" role="option" id="opt-' + idx + '" data-i="' + idx + '">' +
      '<span class="ico ' + tileFor(h.i) + '">' + iconFor(h.s) + '</span>' +
      '<span class="txt"><div class="t1">' + marked(h.t.q, h.used) + '</div>' +
      (snip ? '<div class="t2">' + marked(snip, h.used) + '</div>' : '') +
      (big ? '<div class="t3">' + esc(ROLE_META[h.r].label) + ' · ' + esc(h.s.title) + '</div>' : '') +
      '</span>' + CHEV + '</button>';
  }
  function openHit(h) {
    remember($('q').value);
    closeSearch(true);
    location.hash = 'role=' + h.r + '&task=' + h.t.id;
  }
  function setActive(i) {
    var rows = $('results').querySelectorAll('.row[data-i]');
    if (!rows.length) return;
    active = (i + rows.length) % rows.length;
    rows.forEach(function (b, n) { b.classList.toggle('active', n === active); });
    rows[active].scrollIntoView({ block: 'nearest' });
    $('q').setAttribute('aria-activedescendant', rows[active].id);
  }

  // Focused but empty: recent searches, then suggestions for your role.
  function renderSuggestions() {
    var box = $('results'), r = state.role || 'support', rec = recent();
    current = popularTasks(r).map(function (p) { return { r: r, s: p.s, i: p.i, t: p.t, used: [], lines: [] }; });
    var html = '';
    if (rec.length) {
      html += '<div class="grp"><div class="grp-h">Recent<button type="button" id="clearRecent">Clear</button></div><div class="list">' +
        rec.map(function (q) { return '<button class="row plain" type="button" data-q="' + esc(q) + '"><span class="ico g">' + CLOCK + '</span><span class="txt"><div class="t1">' + esc(q) + '</div></span></button>'; }).join('') + '</div></div>';
    }
    html += '<div class="grp"><div class="grp-h">Suggested</div><div class="list" role="listbox">' + current.map(function (h, i) {
      return '<button class="row" type="button" role="option" id="opt-' + i + '" data-i="' + i + '"><span class="ico ' + tileFor(h.i) + '">' + iconFor(h.s) + '</span><span class="txt"><div class="t1">' + esc(h.t.q) + '</div></span>' + CHEV + '</button>';
    }).join('') + '</div></div>';
    box.innerHTML = html;
    wire(box);
    var cr = $('clearRecent'); if (cr) cr.onclick = function () { try { localStorage.removeItem(RECENT_KEY); } catch (e) { /* ignore */ } renderSuggestions(); $('q').focus(); };
  }

  function renderResults() {
    var qs = $('q').value, box = $('results');
    $('searchBox').classList.toggle('has', !!qs);
    active = -1; $('q').removeAttribute('aria-activedescendant');
    if (!qs.trim()) { if (document.activeElement === $('q')) { show('results'); renderSuggestions(); } else route(true); return; }
    show('results');
    var res = engine.search(qs, state.role), hits = res.hits;
    current = hits;
    $('liveCount').textContent = hits.length ? hits.length + ' result' + (hits.length > 1 ? 's' : '') : 'No results';
    if (!hits.length) {
      var sug = popularTasks(state.role || 'support').slice(0, 4);
      current = sug.map(function (p) { return { r: state.role || 'support', s: p.s, i: p.i, t: p.t, used: [], lines: [] }; });
      box.innerHTML = '<div class="empty">' + MAG.replace('width="18" height="18"', 'width="46" height="46"') +
        '<h3>No results for “' + esc(qs.trim()) + '”</h3><p>Check the spelling or try other words, like “attendance”, “login” or “message”. Or tap the <b>?</b> button in the app to ask a person.</p></div>' +
        (current.length ? '<div class="grp"><div class="grp-h">You might be looking for</div><div class="list" role="listbox">' + current.map(function (h, i) {
          return '<button class="row" type="button" role="option" id="opt-' + i + '" data-i="' + i + '"><span class="ico ' + tileFor(h.i) + '">' + iconFor(h.s) + '</span><span class="txt"><div class="t1">' + esc(h.t.q) + '</div></span>' + CHEV + '</button>';
        }).join('') + '</div></div>' : '');
      wire(box); return;
    }
    var mine = hits.filter(function (h) { return !state.role || h.r === state.role; });
    var others = hits.filter(function (h) { return state.role && h.r !== state.role; });
    var top = mine[0] || others[0];
    var html = '<p class="meta">' + hits.length + ' result' + (hits.length > 1 ? 's' : '') +
      (res.corrected ? ' · Showing results for <b>' + esc(res.corrected) + '</b>' : '') + '</p>';
    html += '<div class="grp top-hit"><div class="grp-h">Top hit</div><div class="list" role="listbox">' + rowHtml(top, hits.indexOf(top), true) + '</div></div>';
    // The rest, grouped by topic, your own role first.
    var groups = [], byKey = {};
    mine.concat(others).forEach(function (h) {
      if (h === top) return;
      var key = h.r + '|' + h.s.id;
      if (!byKey[key]) { byKey[key] = { r: h.r, s: h.s, items: [] }; groups.push(byKey[key]); }
      byKey[key].items.push(h);
    });
    groups.forEach(function (g) {
      var label = (state.role && g.r !== state.role ? ROLE_META[g.r].label + ' guide · ' : '') + g.s.title;
      html += '<div class="grp"><div class="grp-h">' + esc(label) + '</div><div class="list" role="listbox">' +
        g.items.map(function (h) { return rowHtml(h, hits.indexOf(h), false); }).join('') + '</div></div>';
    });
    box.innerHTML = html;
    wire(box);
  }
  function wire(box) {
    box.querySelectorAll('.row[data-i]').forEach(function (b) {
      b.onmousedown = function (e) { e.preventDefault(); }; // keep the keyboard up until the tap lands
      b.onclick = function () { openHit(current[+b.getAttribute('data-i')]); };
    });
    box.querySelectorAll('.row[data-q]').forEach(function (b) {
      b.onmousedown = function (e) { e.preventDefault(); };
      b.onclick = function () { $('q').value = b.getAttribute('data-q'); renderResults(); $('q').focus(); };
    });
  }
  function openSearch() {
    document.querySelector('.top').classList.add('searching');
    $('q').setAttribute('aria-expanded', 'true');
    if (!$('q').value.trim()) { show('results'); renderSuggestions(); }
  }
  function closeSearch(keepView) {
    document.querySelector('.top').classList.remove('searching');
    $('q').setAttribute('aria-expanded', 'false');
    $('q').value = ''; $('searchBox').classList.remove('has');
    $('q').blur();
    if (!keepView) route(true);
  }

  var timer;
  $('q').addEventListener('focus', openSearch);
  $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(renderResults, 60); });
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      var rows = $('results').querySelectorAll('.row[data-i]');
      var pick = active >= 0 ? rows[active] : rows[0];
      if (pick) pick.click();
    } else if (e.key === 'Escape') { closeSearch(); }
  });
  $('clear').onmousedown = function (e) { e.preventDefault(); };
  $('clear').onclick = function (e) { e.preventDefault(); $('q').value = ''; renderResults(); $('q').focus(); };
  $('cancel').onclick = function () { closeSearch(); };

  $('roleBtn').onclick = function () { state.role = null; history.replaceState(null, '', location.pathname + location.search); route(); };
  $('brand').onclick = function () { $('q').value = ''; $('searchBox').classList.remove('has'); location.hash = state.role ? 'role=' + state.role : ''; if (!state.role) route(); };

  // ---------- Router: #role=…  [&section=…]  [&task=…] ----------
  function route(keepScroll) {
    var h = readHash();
    var r = ROLE_META[h.role] ? h.role : null;
    state.role = r;
    if (!keepScroll) { $('q').value = ''; $('searchBox').classList.remove('has'); document.querySelector('.top').classList.remove('searching'); }
    if (!r) { show('picker'); window.scrollTo(0, 0); return; }
    var m = ROLE_META[r];
    $('roleBtn').innerHTML = ico(m.icon) + ' <span class="long">' + m.label + ' · </span>Switch';
    var hit = h.task ? findTask(r, h.task) : null;
    var secId = hit ? hit.s.id : h.section;
    if (!secId || !roleData(r).sections.some(function (s) { return s.id === secId; })) {
      if (state.rendered !== r + '|home') { renderHome(); state.rendered = r + '|home'; }
      show('home'); if (!keepScroll) window.scrollTo(0, 0); return;
    }
    if (state.rendered !== r + '|' + secId) { renderTopic(secId); state.rendered = r + '|' + secId; if (!hit) window.scrollTo(0, 0); }
    show('topic');
    if (hit) {
      var target = $('task-' + hit.t.id);
      target.open = true; target.classList.add('flash'); setTimeout(function () { target.classList.remove('flash'); }, 1600);
      setTimeout(function () { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 40);
    } else if (!keepScroll && h.section) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', function () { route(); });
  renderPicker(); route();
})();
</script>
